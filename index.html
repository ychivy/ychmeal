<!doctype html>
<html lang="zh-Hant">
<head>

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-title" content="友誠餐費">
<meta name="theme-color" content="#FFFCF6">

  html,body{margin:0;height:100%;background:#FFFCF6}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" allow="clipboard-write" title="友誠餐費系統"></iframe>
<script>
  // ↓↓↓ 把下面引號內的網址換成你的 Apps Script「網頁應用程式」/exec 網址 ↓↓↓
  var EXEC_URL = "請貼上你的_exec_網址";
  // ↑↑↑ 只需要改這一行 ↑↑↑
  var q = new URLSearchParams(location.search).get('page') === 'fee' ? '?page=fee' : '';
  document.getElementById('app').src = EXEC_URL + q;
</script>
